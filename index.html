<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placement Drive Tracker</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c2430; --muted: #667085;
    --line: #e4e7ec; --accent: #2563eb; --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420; --card: #171e2e; --ink: #e6e9ef; --muted: #98a2b3;
      --line: #27304a; --accent: #60a5fa; --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5;
  }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form, .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px;
  }
  form { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-bottom: 24px; }
  form .full { grid-column: 1 / -1; }
  label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
  input, select {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; padding: 8px 14px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  #list { display: grid; gap: 12px; }
  .card { display: flex; gap: 16px; align-items: flex-start; }
  .card img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .card .info { flex: 1; min-width: 0; }
  .card h3 { margin: 0; font-size: 1.05rem; }
  .meta { color: var(--muted); font-size: .9rem; margin: 2px 0 8px; }
  .badge {
    display: inline-block; font-size: .75rem; padding: 2px 10px; border-radius: 999px;
    border: 1px solid var(--accent); color: var(--accent); margin-right: 8px;
  }
  .empty, #msg { color: var(--muted); }
  #msg.err { color: var(--danger); }
  @media (max-width: 560px) { form { grid-template-columns: 1fr; } .card { flex-direction: column; } }
</style>
</head>
<body>
<main>
  <h1>Placement Drive Tracker</h1>
  <p class="sub">Serverless app on Azure: Static Web Apps, Functions, Cosmos DB and Blob Storage.</p>

  <form id="form">
    <label>Company
      <input id="company" required maxlength="80" placeholder="e.g. Infosys">
    </label>
    <label>Role
      <input id="role" required maxlength="80" placeholder="e.g. Data Analyst">
    </label>
    <label>Drive date
      <input id="date" type="date">
    </label>
    <label>Status
      <select id="status">
        <option>Upcoming</option><option>Applied</option><option>Test done</option>
        <option>Interview</option><option>Selected</option><option>Rejected</option>
      </select>
    </label>
    <label class="full">Poster (optional, PNG/JPG/WEBP, under 1 MB)
      <input id="poster" type="file" accept="image/png,image/jpeg,image/webp">
    </label>
    <div class="row full">
      <button class="primary" type="submit" id="submitBtn">Add drive</button>
      <button type="button" id="cancelBtn" hidden>Cancel edit</button>
      <span id="msg"></span>
    </div>
  </form>

  <div id="list"><p class="empty">Loading...</p></div>
</main>

<script>
const API = "/api/drives";
let drives = [];
let editingId = null;

const $ = (id) => document.getElementById(id);

function setMsg(text, isErr) {
  $("msg").textContent = text || "";
  $("msg").className = isErr ? "err" : "";
}

async function api(url, options) {
  const res = await fetch(url, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed (" + res.status + ")");
  return data;
}

async function load() {
  try {
    drives = await api(API);
    render();
  } catch (e) {
    $("list").innerHTML = "";
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Could not load drives: " + e.message;
    $("list").appendChild(p);
  }
}

function render() {
  const list = $("list");
  list.innerHTML = "";
  if (!drives.length) {
    list.innerHTML = '<p class="empty">No drives yet. Add one above.</p>';
    return;
  }
  for (const d of drives) {
    const card = document.createElement("div");
    card.className = "card";

    if (d.posterUrl) {
      const img = document.createElement("img");
      img.src = d.posterUrl;
      img.alt = d.company + " poster";
      card.appendChild(img);
    }

    const info = document.createElement("div");
    info.className = "info";
    const h = document.createElement("h3");
    h.textContent = d.company;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = d.role + (d.date ? "  |  " + d.date : "");
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = d.status;

    const edit = document.createElement("button");
    edit.textContent = "Edit";
    edit.onclick = () => startEdit(d);
    const del = document.createElement("button");
    del.textContent = "Delete";
    del.className = "danger";
    del.onclick = () => remove(d);

    const actions = document.createElement("div");
    actions.className = "row";
    actions.append(badge, edit, del);
    info.append(h, meta, actions);
    card.appendChild(info);
    list.appendChild(card);
  }
}

function startEdit(d) {
  editingId = d.id;
  $("company").value = d.company;
  $("role").value = d.role;
  $("date").value = d.date;
  $("status").value = d.status;
  $("poster").value = "";
  $("submitBtn").textContent = "Save changes";
  $("cancelBtn").hidden = false;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetForm() {
  editingId = null;
  $("form").reset();
  $("submitBtn").textContent = "Add drive";
  $("cancelBtn").hidden = true;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

$("cancelBtn").onclick = () => { resetForm(); setMsg(""); };

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  setMsg("Saving...");
  try {
    const body = {
      company: $("company").value,
      role: $("role").value,
      date: $("date").value,
      status: $("status").value,
    };
    const file = $("poster").files[0];
    if (file) {
      if (file.size > 1_000_000) throw new Error("Poster must be under 1 MB");
      body.posterBase64 = await fileToBase64(file);
      body.posterType = file.type;
    }
    const url = editingId ? API + "/" + editingId : API;
    await api(url, {
      method: editingId ? "PUT" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    resetForm();
    setMsg("Saved.");
    await load();
  } catch (e) {
    setMsg(e.message, true);
  }
});

async function remove(d) {
  if (!confirm("Delete " + d.company + "?")) return;
  try {
    await api(API + "/" + d.id, { method: "DELETE" });
    await load();
  } catch (e) {
    setMsg(e.message, true);
  }
}

load();
</script>
</body>
</html>
